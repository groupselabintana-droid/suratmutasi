<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator & Input Surat Mutasi Karyawan</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #f3f4f6; margin: 0; padding: 15px; color: #1f2937; }
        
        .container { max-width: 1350px; margin: 0 auto; display: flex; gap: 20px; align-items: flex-start; }
        
        /* Panel Form Input (Kiri) */
        .control-panel { flex: 1; min-width: 340px; max-width: 450px; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .control-panel h2 { margin-top: 0; font-size: 1.05rem; color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 12px; }
        
        .connection-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 6px; margin-bottom: 14px; font-size: 0.8rem; color: #166534; display: flex; justify-content: space-between; align-items: center; }
        .connection-box button { background: none; border: none; color: #2563eb; text-decoration: underline; cursor: pointer; font-size: 0.8rem; padding: 0; }

        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 4px; color: #374151; }
        .form-group input, .form-group select { width: 100%; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.83rem; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; background: #2563eb; color: #fff; padding: 9px 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; gap: 6px; font-size: 0.85rem; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-success { background: #059669; }
        .btn-success:hover { background: #047857; }
        .btn-print { background: #4f46e5; margin-top: 10px; }
        .btn-print:hover { background: #4338ca; }
        
        /* Panel Pratinjau Dokumen (Kanan) */
        .preview-panel { flex: 1.5; min-width: 320px; display: flex; justify-content: center; overflow-x: auto; padding-bottom: 20px; }
        
        /* Layout Presisi Lembar A4 Sesuai Word */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm 25.4mm 25.4mm 25.4mm;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            font-family: Arial, sans-serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #000;
            position: relative;
            box-sizing: border-box;
            margin: 0 auto;
        }

        /* Styling Kop Surat CV Selabintana */
        .kop-surat {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 6px;
            padding-bottom: 4px;
        }
        .kop-logo {
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 70px;
            height: auto;
        }
        .kop-text {
            text-align: center;
            width: 100%;
        }
        .kop-nama {
            font-size: 16pt;
            font-weight: bold;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 0.5px;
            color: #000;
            margin-bottom: 2px;
        }
        .kop-alamat, .kop-kota {
            font-size: 9.5pt;
            font-family: Arial, sans-serif;
            color: #000;
            line-height: 1.25;
        }
        .kop-line {
            border-bottom: 4px double #000;
            margin-bottom: 22px;
        }

        .doc-header { text-align: center; margin-bottom: 25px; }
        .doc-title { font-size: 14pt; font-weight: bold; text-decoration: underline; margin: 0; text-transform: uppercase; }
        .doc-no { font-size: 11pt; margin-top: 2px; }

        .doc-body p { text-align: justify; margin-bottom: 12px; }
        
        .data-table { width: 100%; margin: 8px 0 12px 0; border-collapse: collapse; }
        .data-table td { padding: 2px 0; vertical-align: top; }
        .data-table td.label-col { width: 110px; }
        .data-table td.colon-col { width: 20px; text-align: center; }
        .data-table td.value-col { font-weight: normal; }

        .signature-section { margin-top: 40px; float: right; width: 220px; text-align: left; }
        .signature-space { height: 65px; }

        .footer-section { position: absolute; bottom: 25.4mm; left: 25.4mm; right: 25.4mm; display: flex; justify-content: space-between; align-items: flex-end; font-size: 10pt; }
        .tembusan { font-size: 10pt; }
        .doc-code { font-size: 9pt; text-align: right; }

        .clear { clear: both; }

        @media screen and (max-width: 1024px) {
            .container { flex-direction: column; }
            .control-panel { max-width: 100%; width: 100%; }
            .preview-panel { width: 100%; }
        }

        @media print {
            body { background: none; padding: 0; }
            .control-panel { display: none !important; }
            .container { max-width: 100%; margin: 0; padding: 0; }
            .preview-panel { width: 100%; padding: 0; }
            .a4-page { box-shadow: none; margin: 0; width: 100%; padding: 15mm 25.4mm 25.4mm 25.4mm; page-break-after: always; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Panel Input Form -->
        <div class="control-panel">
            <!-- Status Koneksi Google Drive -->
            <div id="connectionStatus" class="connection-box">
                <span id="statusText">⏳ Menghubungkan ke Drive...</span>
                <button type="button" onclick="toggleUrlSection()">Ubah URL</button>
            </div>

            <!-- Panel URL -->
            <div id="urlSection" style="display: none; margin-bottom: 14px; background: #f9fafb; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb;">
                <h2 style="font-size: 0.95rem; margin-bottom: 8px;">Koneksi Google Drive Web App</h2>
                <div class="form-group">
                    <label>URL Web App Apps Script</label>
                    <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
                    <button class="btn" onclick="saveAndLoadScriptUrl()" style="margin-top: 6px;">Simpan & Coba Lagi</button>
                </div>
            </div>

            <h2>Input Mutasi Baru</h2>
            <form id="mutasiForm" onsubmit="handleFormSubmit(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Tanggal Surat</label>
                        <input type="date" id="tanggalSurat" required onchange="autoGenerateNomorSurat(); previewRealtime();">
                    </div>
                    <div class="form-group">
                        <label>Nomor Surat (Otomatis)</label>
                        <input type="text" id="nomorSurat" placeholder="001/SB/SM/X/2026" required oninput="previewRealtime()">
                    </div>
                </div>

                <div class="form-group">
                    <label>Nama Karyawan</label>
                    <input type="text" id="namaKaryawan" placeholder="Avin Dyah Novitawanti" required oninput="previewRealtime()">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Jabatan Lama</label>
                        <input type="text" id="jabatanLama" placeholder="Head Unit" required oninput="previewRealtime()">
                    </div>
                    <div class="form-group">
                        <label>Unit Asal</label>
                        <input type="text" id="unitAsal" placeholder="Hatchery Banyumas" required oninput="previewRealtime()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Jabatan Baru</label>
                        <input type="text" id="jabatanBaru" placeholder="Head Unit" required oninput="previewRealtime()">
                    </div>
                    <div class="form-group">
                        <label>Unit Tujuan (Mutasi Ke)</label>
                        <input type="text" id="unitTujuan" placeholder="Hatchery Sukajaya" required oninput="previewRealtime()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Berlaku Mulai Efektif</label>
                        <input type="date" id="berlakuMulai" required oninput="previewRealtime()">
                    </div>
                    <div class="form-group">
                        <label>Keterangan (Opsional)</label>
                        <input type="text" id="keterangan" placeholder="Perbantuan / Promosi">
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn btn-success" style="margin-top: 6px;">
                    💾 Simpan ke Google Drive & Buat Surat
                </button>
            </form>

            <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 14px 0;">

            <h2>Riwayat Data Tersimpan</h2>
            <div class="form-group">
                <select id="savedSelect" onchange="loadFromSavedSelect()">
                    <option value="">-- Pilih Data Mutasi Tersimpan --</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Kota Penerbitan</label>
                    <input type="text" id="issueCity" value="Sukabumi" oninput="previewRealtime()">
                </div>
                <div class="form-group">
                    <label>Penandatangan</label>
                    <input type="text" id="signerName" value="Drh, Titin Idayati" oninput="previewRealtime()">
                </div>
            </div>

            <button class="btn btn-print" onclick="window.print()">
                🖨️ Cetak / Simpan PDF
            </button>
        </div>

        <!-- Panel Pratinjau Surat -->
        <div class="preview-panel">
            <div class="a4-page">
                <!-- Kop Surat CV Selabintana -->
                <div class="kop-surat">
