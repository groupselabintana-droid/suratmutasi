<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator & Input Surat Mutasi Karyawan</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
        
        .container { max-width: 1250px; margin: 0 auto; display: flex; gap: 24px; flex-wrap: wrap; }
        
        /* Panel Form Input (Kiri) */
        .control-panel { flex: 1; min-width: 360px; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); height: fit-content; }
        .control-panel h2 { margin-top: 0; font-size: 1.1rem; color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 14px; }
        
        .connection-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 6px; margin-bottom: 14px; font-size: 0.8rem; color: #166534; display: flex; justify-content: space-between; align-items: center; }
        .connection-box button { background: none; border: none; color: #2563eb; text-decoration: underline; cursor: pointer; font-size: 0.8rem; padding: 0; }

        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.82rem; margin-bottom: 4px; color: #374151; }
        .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.85rem; }
        .form-group small { color: #6b7280; font-size: 0.72rem; display: block; margin-top: 2px; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; background: #2563eb; color: #fff; padding: 10px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; gap: 8px; font-size: 0.875rem; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-success { background: #059669; }
        .btn-success:hover { background: #047857; }
        .btn-print { background: #4f46e5; margin-top: 10px; }
        .btn-print:hover { background: #4338ca; }
        
        /* Panel Pratinjau Dokumen (Kanan) */
        .preview-panel { flex: 1.8; min-width: 340px; display: flex; justify-content: center; }
        
        /* Layout Presisi Lembar A4 Sesuai Word */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm 25.4mm 25.4mm 25.4mm;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            font-family: Arial, sans-serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #000;
            position: relative;
            box-sizing: border-box;
            margin: 0 auto;
        }

        /* Styling Kop Surat CV Selabintana */
        .kop-surat {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 4px;
            padding-bottom: 4px;
        }
        .kop-logo {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        .kop-logo img {
            height: 70px;
            width: auto;
            display: block;
        }
        .kop-text {
            text-align: center;
            width: 100%;
        }
        .kop-nama {
            font-size: 16pt;
            font-weight: bold;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 0.5px;
            color: #000;
            margin-bottom: 2px;
        }
        .kop-alamat, .kop-kota {
            font-size: 9.5pt;
            font-family: Arial, sans-serif;
            color: #000;
            line-height: 1.25;
        }
        .kop-line {
            border-bottom: 4px double #000;
            margin-bottom: 22px;
        }

        .doc-header { text-align: center; margin-bottom: 25px; }
        .doc-title { font-size: 14pt; font-weight: bold; text-decoration: underline; margin: 0; text-transform: uppercase; }
        .doc-no { font-size: 11pt; margin-top: 2px; }

        .doc-body p { text-align: justify; margin-bottom: 12px; }
        
        .data-table { width: 100%; margin: 8px 0 12px 0; border-collapse: collapse; }
        .data-table td { padding: 2px 0; vertical-align: top; }
        .data-table td.label-col { width: 110px; }
        .data-table td.colon-col { width: 20px; text-align: center; }
        .data-table td.value-col { font-weight: normal; }

        .signature-section { margin-top: 40px; float: right; width: 220px; text-align: left; }
        .signature-space { height: 65px; }

        .footer-section { position: absolute; bottom: 25.4mm; left: 25.4mm; right: 25.4mm; display: flex; justify-content: space-between; align-items: flex-end; font-size: 10pt; }
        .tembusan { font-size: 10pt; }
        .doc-code { font-size: 9pt; text-align: right; }

        .clear { clear: both; }

        @media print {
            body { background: none; padding: 0; }
            .control-panel { display: none !important; }
            .container { max-width: 100%; margin: 0; }
            .preview-panel { width: 100%;
